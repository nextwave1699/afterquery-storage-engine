schema_version = "1.3"

# Only /app/leveldb goes to the verifier, which runs in its own container.
artifacts = [
  { source = "/app/leveldb", destination = "leveldb", exclude = [".git", "build", "__pycache__"] },
]

[task]
name = "afterquery/storage-engine"
version = "1.0.0"
description = """
Change the compaction strategy of a pinned LevelDB (1.23) so that twelve \
fixed LSM-tree workloads (random and skewed overwrites, sequential sweeps, \
write bursts, tiny and 6 KB values, sparse writes, scan-heavy reads, \
interleaved appends and low-key updates, and time-series appends with \
TTL-style purges) are written with as few bytes as possible relative to the \
untouched engine (score: geometric mean of the per-workload \
write-amplification ratios), while every read stays correct, crash \
recovery at every engine event works for both engines, the pristine engine \
can read the candidate's databases and vice versa, and level-0 depth, \
space, read bytes and memory stay inside the baseline's envelope on every \
workload."""
authors = [
  { name = "nextwave1699", email = "nextwave1699@gmail.com" },
]
keywords = [
  "databases",
  "storage-engine",
  "lsm-tree",
  "leveldb",
  "compaction",
  "write-amplification",
  "crash-recovery",
  "c++",
  "systems",
]

[metadata]
author_name = "nextwave1699"
author_email = "nextwave1699@gmail.com"
difficulty_explanation = """
The score is the geometric mean over twelve workloads of the candidate's \
write amplification divided by the pristine engine's (untouched 1.0), and \
every workload carries the same guardrails (level-0 depth <= 4, peak space \
1.25x, bytes on disk 1.5x, phase-F reads 1.5x (2.5x on ttl), files, memory, \
time).  No single knob wins them all.  Disabling seek-triggered \
compactions, the biggest lever on mixed (0.43) and bursts (0.39), fails the \
gate outright: on series and ttl, whose scans cross ranges purged in key \
order, tombstones are then never compacted away and phase-F reads grow 24x \
and 26x.  Across all twelve that strategy averages 0.69 instead of the 0.43 \
it scores on mixed alone, because workloads with little headroom (hotkey \
3.5x pristine WA, series 4.3, ttl 3.7, blob 5.1) pull a narrow policy back \
towards 1.0.  Going lower means judging which compactions pay for \
themselves (tombstone density, overlap cost, how hot a file still is), how \
inputs are chosen and outputs cut against the grandparent level, and how \
the flush side interacts with all of it: bimodal interleaves tail appends \
with updates low in the key space, so every flush spans nearly the whole \
key range, and two obvious fixes measured worse (splitting flush output by \
size, or at the level-1 file boundaries it overlaps, cost 0.82 -> 1.14 \
there), which is the kind of dead end that has to be measured rather than \
reasoned about.  \
Every change must survive eleven crash scenarios with the pristine engine \
recovering the same directory, and keep the MANIFEST, WAL and table formats \
byte-compatible.  Nothing the engine reports is trusted: bytes come from \
the kernel, the level layout from a MANIFEST replay."""
solution_explanation = """
No reference solution is shipped, so there is no solve bar and the score is \
open-ended.  scripts/sample_candidate.patch is a known-valid engine used by \
scripts/docker_failure_paths.sh: min-overlap-per-byte file selection scaled \
by an in-memory hotness estimate, and outputs cut at grandparent file \
boundaries once they reach a quarter of the target size, with seek \
compactions left on.  It passes every gate and scores 0.8213.  \
scripts/old_reference.patch (the same, but with seek compactions disabled) \
fails the series and ttl read guardrails.  Agents working against the \
earlier four-workload version of this task reached 0.56-0.62 there; the \
same class of policy measures about 0.7 across these twelve."""
verification_explanation = """
A separate verifier image carries the sealed pristine source, the fixtures \
and the harness.  It builds the pristine engine (as root) and the candidate \
(as an unprivileged user that cannot read /tests), compiles its own harness \
against each, then: (1) selftest through the public API; (2) a small \
workload written by each engine and read by both, every read checked \
against the in-memory model; (3) eleven crash scenarios (SIGKILL at WAL \
append, table close, before/after a MANIFEST append, before a file removal, \
mid-table, mid-compaction, after a compaction is installed, during reopen \
before the CURRENT rename and after the recovery MANIFEST, torn WAL tail): acknowledged batches must be \
recovered by the candidate and by the pristine engine, the candidate \
continues, the pristine reads the result, the directory is consistent; (4) \
five sealed pristine-written databases (clean, live WAL, torn WAL, \
reuse_logs, filterless 16 KB-block tables) plus a fresh-seed one, read and \
extended by the candidate and read back by the pristine; (5) the full \
workloads (twelve of them) at a fixed sealed seed for both engines: bytes \
written \
are read from /proc/<pid>/io of the stopped harness process (then killed, so \
no atexit code runs), divided by the logical bytes computed by the pristine \
harness; cross reads at full scale; guardrails from a Python replay of the \
MANIFEST history (level-0 depth, peak space, file count and size, memtable \
switches) and from the kernel (phase-F read bytes, peak RSS, wall time).  \
reward.txt (= gate_passed) is 1 when every stage and every guardrail hold, \
which the untouched tree does.  The objective write_amp_ratio is the \
geometric mean of candidate WA / pristine WA over the twelve workloads from \
the same run, so the untouched tree scores 1.0 (same code, same seed; \
within ~1e-4, see README); the guardrails and cross reads apply per workload; \
it is reported as 1.0 whenever the gate fails.  Both reward files are \
written with reward 0 first and rewritten at the end."""
category = "Software"
subcategory = "Databases"
tags = ["performance", "c++", "leveldb", "lsm-tree", "compaction", "crash-recovery", "storage"]
expert_time_estimate_hours = 10
relevant_experience = """
Author of earlier performance tasks in this series (SQLite query speedup, \
ray-tracer speedup, interpreter and compiler speedups); has worked on \
LevelDB/RocksDB-based storage in production, including compaction tuning \
and crash-consistency testing with fault-injecting Env implementations."""

[metadata.scoring]
paradigm = "performance"
# reward == gate_passed: builds, all correctness stages pass and the
# guardrails hold. The untouched tree passes.
#
# write_amp_ratio = geometric mean over the twelve workloads of candidate WA
# / pristine WA, measured in the same run at a fixed seed.
# Untouched: 1.0 (Harbor nop twice: 1.0 and 1.00002; series can wobble ~1e-4). No reference is shipped, so there
# is no solve bar. Reported as 1.0 when the gate fails, as are the
# informational write_amp_ratio_<workload> keys; write_amp and
# baseline_write_amp are geometric means of the absolute WAs.
gate = { key = "gate_passed" }
objectives = [
  { key = "write_amp_ratio", direction = "lower", baseline = 1.0, tolerance = 0.01, tolerance_kind = "abs", unit = "x" },
]
# 493 s end to end on a 16-core desktop for the untouched tree (twelve
# workloads, both engines, cross reads); slower machines need the headroom.
verifier_runtime_sec = 2700
# apt + untar only, no compiling.
build_runtime_sec = 1800
# Full run ~15 min; "--quick" is the documented fast proxy (~2 min).
self_check = "/app/bench/bench.py"

[verifier]
# ~8 min locally for the untouched tree; slow candidates and slower machines
# need the headroom.
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.env]

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0

[agent]
timeout_sec = 14400.0

[environment]
# No cpu/memory limits: builds use a fixed -j4 and the benchmark runs one
# writer plus one background thread.
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
