schema_version = "1.3"

# The agent's tree is handed to the verifier, which runs in its own container
# (built from tests/) and reads nothing else the agent could have written.
artifacts = [
  { source = "/app/leveldb", destination = "leveldb", exclude = [".git", "build", "__pycache__"] },
]

[task]
name = "afterqery/storage-engine"
version = "1.0.0"
description = """
Change the compaction strategy of a pinned LevelDB (1.23) so that a fixed \
730 MB LSM-tree workload (sequential and random inserts, hot-range updates, \
range purges, a sliding hot window, interleaved reads and snapshots) is \
written with a kernel-measured write amplification of at most 5.4 (the \
untouched engine measures 15-16.5), while every read stays correct, crash \
recovery at every engine event works for both engines, the pristine engine \
can read the candidate's databases and vice versa, and level-0 depth, \
space, read bytes and memory stay inside the baseline's envelope."""
authors = [
  { name = "nextwave1699", email = "nextwave1699@gmail.com" },
]
keywords = [
  "databases",
  "storage-engine",
  "lsm-tree",
  "leveldb",
  "compaction",
  "write-amplification",
  "crash-recovery",
  "c++",
  "systems",
]

[metadata]
author_name = "nextwave1699"
author_email = "nextwave1699@gmail.com"
difficulty_explanation = """
The bar sits below what any single change reaches: disabling LevelDB's \
seek-triggered compactions (the dominant waste on this workload) takes the \
write amplification from ~15.5 to ~6.1, adding min-overlap file selection \
or grandparent-aligned outputs to that reaches ~5.7, and the constant \
tweaks that would get further (larger level-0 trigger, a bigger level 1) \
are ruled out by the level-0 depth and peak-space guardrails, which pin the \
candidate to the baseline's read-amplification and space envelope; at the \
verifier's scale a bigger level 1 is not even a win.  Reaching 5.4 \
therefore needs several independent compaction-policy changes that each \
require understanding version_set.cc: how compaction inputs are picked, how \
outputs are cut against the grandparent level, how overwritten versions and \
tombstones are dropped, and what the on-disk invariants of levels >= 1 and \
of level-0 file numbering are (the pristine engine's Get relies on them and \
the verifier reads every candidate database with the pristine engine).  \
Every change must survive eleven crash scenarios that SIGKILL the process at \
WAL, table, MANIFEST, file-removal, compaction and recovery events, with the pristine \
engine recovering the same directory, and must keep the MANIFEST, WAL and \
table formats byte-compatible.  Nothing the engine reports is trusted: \
bytes are read from the kernel, the level layout from a MANIFEST replay."""
solution_explanation = """
Four changes to db/version_set.{h,cc}, db/db_impl.cc and db/version_edit.h \
(solution/compaction.patch): (1) reads no longer schedule compactions -- a \
seek-triggered compaction rewrites a table and everything it overlaps one \
level down without reducing the data; (2) size-triggered compactions at \
level >= 1 pick the file whose overlap with the next level, relative to its \
own size, is smallest instead of the next one in key order; (3) every \
compaction classifies entries as fresh (written since the previous \
compaction into the same level) or old and records each output's fresh \
fraction in memory, and the selection prefers cold files, because a file \
still receiving updates is rewritten by the next merge into its level \
anyway and pushing it down only moves soon-to-be garbage; (4) compaction \
outputs are cut at grandparent file boundaries once they reach a quarter of \
the target file size, so that when they are compacted down later they \
overlap whole files only.  The reference measures 4.97-5.01 across seeds \
(bar 5.40, untouched 14.8-16.5) with level-0 depth 4, peak space 1.13x and \
phase-F read bytes 0.95x of the baseline."""
verification_explanation = """
A separate verifier image carries the sealed pristine source, the fixtures \
and the harness.  It builds the pristine engine (as root) and the candidate \
(as an unprivileged user that cannot read /tests), compiles its own harness \
against each, then: (1) selftest through the public API; (2) a small \
workload written by each engine and read by both, every read checked \
against the in-memory model; (3) eleven crash scenarios (SIGKILL at WAL \
append, table close, before/after a MANIFEST append, before a file removal, \
mid-table, mid-compaction, after a compaction is installed, during reopen \
before the CURRENT rename and after the recovery MANIFEST, torn WAL tail): acknowledged batches must be \
recovered by the candidate and by the pristine engine, the candidate \
continues, the pristine reads the result, the directory is consistent; (4) \
five sealed pristine-written databases (clean, live WAL, torn WAL, \
reuse_logs, filterless 16 KB-block tables) plus a fresh-seed one, read and \
extended by the candidate and read back by the pristine; (5) the full \
workload with a seed drawn at verify time for both engines: bytes written \
are read from /proc/<pid>/io of the stopped harness process (then killed, so \
no atexit code runs), divided by the logical bytes computed by the pristine \
harness; cross reads at full scale; guardrails from a Python replay of the \
MANIFEST history (level-0 depth, peak space, file count and size, memtable \
switches) and from the kernel (phase-F read bytes, peak RSS, wall time).  \
reward.txt is 1 only when every stage, every guardrail and write \
amplification <= 5.40 hold; both reward files are written fail-closed first \
and rewritten at the end."""
category = "Software"
subcategory = "Databases"
tags = ["performance", "c++", "leveldb", "lsm-tree", "compaction", "crash-recovery", "storage"]
expert_time_estimate_hours = 10
relevant_experience = """
Author of earlier performance tasks in this series (SQLite query speedup, \
ray-tracer speedup, interpreter and compiler speedups); has worked on \
LevelDB/RocksDB-based storage in production, including compaction tuning \
and crash-consistency testing with fault-injecting Env implementations."""

[metadata.scoring]
paradigm = "performance"
# reward.txt and reward.json's "reward" equal gate_passed: the candidate
# builds, every correctness stage (functional, differential, crash recovery,
# on-disk compatibility) passes, every guardrail holds AND the write
# amplification of the fixed workload is at or below the bar of 5.40.  The
# untouched engine (15-16.5) does not pass; the reference (~5.0) does.
#
# The objective is scored_write_amp: the measured write amplification once
# the gate is passed (lower is better), reported as 0 (no credit) below it.
# write_amp (unthresholded), baseline_write_amp and wa_reduction are reported
# alongside for inspection.
gate = { key = "gate_passed" }
objectives = [
  { key = "scored_write_amp", direction = "lower", baseline = 5.4, tolerance = 0.02, tolerance_kind = "abs", unit = "x", saturation = 4.0 },
]
# Measured on the reference solution, 16-core desktop: ~6 min for all of
# test.sh (1.5 min builds, 1 min small workload + crash scenarios, 0.5 min
# fixtures, 2.5 min full workload for both engines with cross reads).
verifier_runtime_sec = 1800
# Both images are apt plus unpacking one archive; nothing is compiled at
# build time.
build_runtime_sec = 1800
self_check = "/app/bench/bench.py"

[verifier]
# ~6 min on the reference machine; the platform's machines may be several
# times slower.
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]

[verifier.environment]
# The verifier's own image is built from tests/ and consults nothing outside
# itself.
network_mode = "no-network"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0

[agent]
timeout_sec = 14400.0

[environment]
# The agent keeps internet access while it works.  No cpu/memory limits are
# declared; the builds use a literal -j4 and the benchmark is single-writer
# with one background worker.
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
