schema_version = "1.3"

# Only /app/leveldb goes to the verifier, which runs in its own container.
artifacts = [
  { source = "/app/leveldb", destination = "leveldb", exclude = [".git", "build", "__pycache__"] },
]

[task]
name = "afterquery/storage-engine"
version = "2.0.0"
description = """
Add range deletes (range tombstones) and merge operators to a pinned LSM-tree \
storage engine (LevelDB 1.23), correct under snapshots, iterators, crashes and \
compactions, and efficient: range deletes cost the same whatever they cover, \
reads skip what they hide and stay fast under 100,000 tombstones, space comes \
back through background compaction, merges never read the value."""
authors = [
  { name = "nextwave1699", email = "nextwave1699@gmail.com" },
]
keywords = [
  "databases",
  "storage-engine",
  "lsm-tree",
  "leveldb",
  "range-tombstones",
  "merge-operator",
  "compaction",
  "crash-recovery",
  "c++",
  "systems",
]

[metadata]
author_name = "nextwave1699"
author_email = "nextwave1699@gmail.com"
difficulty_explanation = """
Two features RocksDB took years to get right, added to LevelDB under a \
model-checked conformance suite (12,000 seeded scenarios plus 400 long ones, \
every read compared with a model), 400 randomized crashes, compatibility with \
the untouched engine and efficiency limits measured by the kernel.  Range \
tombstones touch every layer: the write batch and WAL format, the memtable \
(which must answer "is this key covered" in logarithmic time with 100,000 \
tombstones in it), the table format (a tombstone block, file boundaries that \
cover tombstones, a MANIFEST record that older engines never see unless \
tombstones exist), point lookups and iterators in both directions (which \
must seek past ranges a newer layer's tombstone hides instead of reading \
them), and compaction (snapshot stripes decide what may be dropped; \
tombstones are clipped to output files and dropped only at the bottom; \
files whose tombstones hide data below must be compacted on their own so \
the space comes back).  Merge operands interact with all of it: lookups \
continue across memtables and levels collecting operands, iterators fold \
them forwards and backwards (switching direction mid-key), and compactions \
fold them per snapshot stripe with PartialMerge/FullMerge without any \
reader being able to tell.  The operator in the harness is not commutative, \
so any ordering or duplication mistake shows.  The obvious shortcuts \
(expanding a range into point deletes, read-modify-write merges, a global \
tombstone list rebuilt per read, iterators that filter covered keys one by \
one) are each rejected by an efficiency limit, by a margin of 5-30x.  Bugs \
that appear once in thousands of scenarios still fail the gate."""
solution_explanation = """
solution/reference.patch (+1900 lines over 32 files).  Tombstones: a \
kTypeRangeDeletion record in WriteBatch/WAL; in the memtable an insertion-order \
list plus an incrementally fragmented map (O(log n) coverage queries); in \
tables a range-deletion block named in the metaindex, with file bounds widened \
to (begin, seq) .. (end, kMaxSequenceNumber) and a new MANIFEST tag only for \
files that have one.  Reads use a view over the memtables' maps and a \
per-version fragmented index tagged with layers (memtable, immutable \
memtable, level-0 files newest first, levels): Get and each child iterator \
skip anything a newer layer's tombstone covers; DBIter hides entries covered \
within a layer by sequence number.  Merges: kTypeMerge entries; lookups \
collect operands until a base; DBIter folds them in both directions.  \
Compaction buffers each user key, splits its entries into snapshot stripes, \
treats entries covered by a same-stripe tombstone as deletions, folds \
operands with FullMerge (base known, or nothing older anywhere) or \
PartialMerge, never cuts an output file inside a user key, clips tombstones \
to each output's range, and drops tombstones at the bottom once no snapshot \
needs them.  VersionSet::Finalize marks a file whose tombstones hide more \
than max(1 MB, 2x its size) of deeper data for compaction.  It passes every \
check locally (feature_score 1.0; efficiency margins in README.md)."""
verification_explanation = """
A separate verifier image carries the sealed pristine source, fixtures and \
harness.  It builds the pristine engine (root) and the candidate (an \
unprivileged user that cannot read /tests), compiles its own harness against \
each (the conformance suite against the candidate's include/, a stock-only \
build of it against the pristine), then runs: the API checks; 12,000 \
scenarios with range deletes and merges (300 ops), 400 long ones (3,000 ops) \
and 1,000 stock ones, every read checked against a model; a small stock \
workload cross-read by both engines; eleven fixed crash points in a stock \
workload recovered by both engines; 400 randomized crashes at Env events \
(60% in scenarios with the new records, recovered by the candidate; 20% \
stock, recovered identically by both engines; 20% written by the pristine, \
recovered by the candidate); six pristine-written databases read and \
extended; the efficiency cases (conftest perf rangedel, manyranges, merge) \
with limits on kernel I/O counters of each phase, table bytes and CPU time; \
and three stock workloads at scale 3 on both engines (write amplification at \
most 1.10x the pristine's, plus the level-0, space, read, file, memory and \
time guardrails).  gate_passed (= reward.txt) is 1 only when every stage \
passes.  feature_score is the mean over api, conformance, recovery and \
efficiency of the fraction of checks passed; the untouched tree has no \
extension API, so the suite does not compile against it and it scores 0.  \
Both reward files are written with 0 first and rewritten at the end."""
category = "Software"
subcategory = "Databases"
tags = ["implementation", "c++", "leveldb", "lsm-tree", "range-tombstones", "merge-operator", "crash-recovery", "storage"]
expert_time_estimate_hours = 40
relevant_experience = """
Author of earlier tasks in this series (SQLite query speedup, ray-tracer \
speedup, interpreter and compiler speedups); has worked on LevelDB/RocksDB-based \
storage in production, including compaction tuning and crash-consistency \
testing with fault-injecting Env implementations."""

[metadata.scoring]
paradigm = "implementation"
# reward == gate_passed: builds, the extension API compiles, and every stage
# passes (api, conformance, recovery, efficiency, and the stock stages).
# The untouched tree fails it: the suite does not compile against it.
gate = { key = "gate_passed" }
# Fraction of the extension checks passed, averaged over the four scored
# stages (api, conformance, recovery, efficiency).  Untouched: 0.0 (Harbor
# nop); the reference: 1.0.
objectives = [
  { key = "feature_score", direction = "higher", baseline = 0.0, tolerance = 0.01, tolerance_kind = "abs", unit = "fraction" },
]
# ~6 min on a 16-core desktop for the reference (most of it the stock
# benchmark on both engines); slower machines need the headroom.
verifier_runtime_sec = 2700
# apt + untar only, no compiling.
build_runtime_sec = 1800
self_check = "/app/bench/bench.py"

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.env]

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0

[agent]
# Bounds solve.sh (applying the reference patch); agent attempts run on the
# platform's own clock.
timeout_sec = 72000.0

[environment]
# No cpu/memory limits: builds use a fixed -j4 and the harness runs at most
# eight scenario processes at once.
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
