schema_version = "1.3"

# Only /app/leveldb goes to the verifier, which runs in its own container.
artifacts = [
  { source = "/app/leveldb", destination = "leveldb", exclude = [".git", "build", "__pycache__"] },
]

[task]
name = "afterquery/storage-engine"
version = "1.0.0"
description = """
Change the compaction strategy of a pinned LevelDB (1.23) so that four \
fixed LSM-tree workloads (a mixed insert/update/delete/scan workload, uniform \
random overwrites, time-series appends with late corrections and TTL-style \
purges, and large values with a scattered hot set) are written with as few \
bytes as possible relative to the untouched engine (score: geometric mean of \
the per-workload write-amplification ratios), while every read stays \
correct, crash recovery at every engine event works for both engines, the \
pristine engine can read the candidate's databases and vice versa, and \
level-0 depth, space, read bytes and memory stay inside the baseline's \
envelope on every workload."""
authors = [
  { name = "nextwave1699", email = "nextwave1699@gmail.com" },
]
keywords = [
  "databases",
  "storage-engine",
  "lsm-tree",
  "leveldb",
  "compaction",
  "write-amplification",
  "crash-recovery",
  "c++",
  "systems",
]

[metadata]
author_name = "nextwave1699"
author_email = "nextwave1699@gmail.com"
difficulty_explanation = """
The score is the geometric mean over four workloads of the candidate's \
write amplification divided by the pristine engine's (untouched 1.0).  The \
workloads pull compaction policy in different directions, and every \
workload has the same guardrails (level-0 depth <= 4, peak space 1.25x, \
phase-F read bytes 1.5x, time, memory), so no single knob wins.  The \
biggest single lever on mixed and uniform, disabling LevelDB's \
seek-triggered compactions, fails the gate: on series, whose scans start \
inside purged key ranges, the tombstones are then never compacted away and \
phase-F reads grow 24x and wall time 6x.  A good solution has to replace \
seek compactions with something that knows when a compaction pays for \
itself (tombstone density, overlap cost, how hot a file still is), choose \
inputs and cut outputs well (min-overlap selection, grandparent-aligned \
outputs), and handle append-mostly data (series) and large values (blob) \
without breaking space or read limits on the update-heavy ones.  That needs \
a working model of version_set.cc and db_impl.cc: how compactions are \
scored and picked, how outputs are cut against the grandparent level, when \
overwritten versions and tombstones can be dropped, and the on-disk \
invariants of levels >= 1 and level-0 file numbering (the pristine engine's \
Get relies on them, and the verifier reads every candidate database with \
the pristine engine).  Every change must survive eleven crash scenarios, \
with the pristine engine recovering the same directory, and keep the \
MANIFEST, WAL and table formats byte-compatible.  Known points on the \
scored seed: seek compactions off alone fails the gate (series); the \
earlier single-workload reference (0.35 on mixed) fails it too; its policy \
changes with seek compactions kept pass everywhere at 0.85.  No lower bound \
is known."""
solution_explanation = """
No reference solution is shipped, so there is no solve bar; the score is \
open-ended.  scripts/sample_candidate.patch is a known-valid engine used by \
scripts/docker_failure_paths.sh: min-overlap-per-byte file selection scaled \
by an in-memory hotness estimate, and outputs cut at grandparent file \
boundaries once they reach a quarter of the target size, with seek \
compactions left on.  It passes every gate and scores 0.853 (mixed 0.773, \
uniform 0.819, series 0.983, blob 0.850).  scripts/old_reference.patch, \
the earlier single-workload reference, also disables seek compactions: it \
reaches 0.35 on mixed but fails the series read and time guardrails."""
verification_explanation = """
A separate verifier image carries the sealed pristine source, the fixtures \
and the harness.  It builds the pristine engine (as root) and the candidate \
(as an unprivileged user that cannot read /tests), compiles its own harness \
against each, then: (1) selftest through the public API; (2) a small \
workload written by each engine and read by both, every read checked \
against the in-memory model; (3) eleven crash scenarios (SIGKILL at WAL \
append, table close, before/after a MANIFEST append, before a file removal, \
mid-table, mid-compaction, after a compaction is installed, during reopen \
before the CURRENT rename and after the recovery MANIFEST, torn WAL tail): acknowledged batches must be \
recovered by the candidate and by the pristine engine, the candidate \
continues, the pristine reads the result, the directory is consistent; (4) \
five sealed pristine-written databases (clean, live WAL, torn WAL, \
reuse_logs, filterless 16 KB-block tables) plus a fresh-seed one, read and \
extended by the candidate and read back by the pristine; (5) the full \
workloads (mixed, uniform, series, blob) at a fixed sealed seed for both \
engines: bytes written \
are read from /proc/<pid>/io of the stopped harness process (then killed, so \
no atexit code runs), divided by the logical bytes computed by the pristine \
harness; cross reads at full scale; guardrails from a Python replay of the \
MANIFEST history (level-0 depth, peak space, file count and size, memtable \
switches) and from the kernel (phase-F read bytes, peak RSS, wall time).  \
reward.txt (= gate_passed) is 1 when every stage and every guardrail hold, \
which the untouched tree does.  The objective write_amp_ratio is the \
geometric mean of candidate WA / pristine WA over the four workloads from \
the same run, so the untouched tree scores 1.0 (same code, same seed; \
within ~1e-4, see README); the guardrails and cross reads apply per workload; \
it is reported as 1.0 whenever the gate fails.  Both reward files are \
written with reward 0 first and rewritten at the end."""
category = "Software"
subcategory = "Databases"
tags = ["performance", "c++", "leveldb", "lsm-tree", "compaction", "crash-recovery", "storage"]
expert_time_estimate_hours = 10
relevant_experience = """
Author of earlier performance tasks in this series (SQLite query speedup, \
ray-tracer speedup, interpreter and compiler speedups); has worked on \
LevelDB/RocksDB-based storage in production, including compaction tuning \
and crash-consistency testing with fault-injecting Env implementations."""

[metadata.scoring]
paradigm = "performance"
# reward == gate_passed: builds, all correctness stages pass and the
# guardrails hold. The untouched tree passes.
#
# write_amp_ratio = geometric mean over mixed/uniform/series/blob of
# candidate WA / pristine WA, measured in the same run at a fixed seed.
# Untouched: 1.0 (Harbor nop twice: 1.0 and 1.00002; series can wobble ~1e-4). No reference is shipped, so there
# is no solve bar. Reported as 1.0 when the gate fails, as are the
# informational write_amp_ratio_<workload> keys; write_amp and
# baseline_write_amp are geometric means of the absolute WAs.
gate = { key = "gate_passed" }
objectives = [
  { key = "write_amp_ratio", direction = "lower", baseline = 1.0, tolerance = 0.01, tolerance_kind = "abs", unit = "x" },
]
# ~4 min end to end on a 16-core desktop for the untouched tree (233 s); a
# slow candidate and the platform's slower machines need the headroom.
verifier_runtime_sec = 2700
# apt + untar only, no compiling.
build_runtime_sec = 1800
self_check = "/app/bench/bench.py"

[verifier]
# ~4 min locally; slow candidates and slower machines need the headroom.
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.env]

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0

[agent]
timeout_sec = 14400.0

[environment]
# No cpu/memory limits: builds use a fixed -j4 and the benchmark runs one
# writer plus one background thread.
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
